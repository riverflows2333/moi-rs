[package]
name = "moirspy"
version = "0.2.2"
edition.workspace = true
authors.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "moirspy"
crate-type = ["cdylib"]

[features]
default = ["legacy-python-backend"]
# Compatibility transport for third-party `moirspy_<name>.Model` packages.
# Built-in native backends do not use this feature at runtime.
legacy-python-backend = []

[dependencies]
pyo3.workspace = true
moi-core.workspace = true
moi-solver-api.workspace = true
moi-bridge.workspace = true
moi-solver-copt.workspace = true
numpy = "0.29.0"
