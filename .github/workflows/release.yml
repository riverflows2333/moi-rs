name: Build and Publish PyPI

on:
  push:
    tags:
      - 'moirspy-v*'
      - 'moirspy-gurobi-v*'
      - 'moirspy-copt-v*'
  workflow_dispatch:

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine target packages based on tag
        id: set-packages
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/moirspy-v* ]]; then
            echo 'packages=["moirspy"]' >> "$GITHUB_OUTPUT"
            echo 'release_package=moirspy' >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/moirspy-gurobi-v* ]]; then
            echo 'packages=["moirspy-gurobi"]' >> "$GITHUB_OUTPUT"
            echo 'release_package=moirspy-gurobi' >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/moirspy-copt-v* ]]; then
            echo 'packages=["moirspy-copt"]' >> "$GITHUB_OUTPUT"
            echo 'release_package=moirspy-copt' >> "$GITHUB_OUTPUT"
          else
            echo 'packages=["moirspy", "moirspy-gurobi", "moirspy-copt"]' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        env:
          PACKAGE: ${{ steps.set-packages.outputs.release_package }}
        run: |
          tag_version="${GITHUB_REF_NAME#${PACKAGE}-v}"
          crate_version="$(awk -F '"' '/^version = "/ { print $2; exit }' "python/${PACKAGE}/Cargo.toml")"
          if [[ -z "$crate_version" || "$tag_version" != "$crate_version" ]]; then
            echo "Tag version '$tag_version' does not match ${PACKAGE} version '$crate_version'." >&2
            exit 1
          fi

  test-copt-backend:
    name: Test COPT backend without native runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Run solver-independent and native-skip tests
        run: cargo test -p moi-solver-copt

  build-wheels:
    name: Build ${{ matrix.package }} on ${{ matrix.platform.runner }} (${{ matrix.platform.target }})
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
          - runner: windows-latest
            target: x64
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python/${{ matrix.package }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: 'true'
          manylinux: auto

      - name: Verify backend wheel contents
        if: matrix.package != 'moirspy'
        run: python .github/scripts/audit_solver_artifact.py python/${{ matrix.package }}/dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: python/${{ matrix.package }}/dist
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: Build ${{ matrix.package }} sdist
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python/${{ matrix.package }}
          command: sdist
          args: --out dist

      - name: Verify backend sdist contents
        if: matrix.package != 'moirspy'
        run: python .github/scripts/audit_solver_artifact.py python/${{ matrix.package }}/dist
          
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist-${{ matrix.package }}
          path: python/${{ matrix.package }}/dist
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [test-copt-backend, build-wheels, sdist]
    
    permissions:
      id-token: write
      contents: read
      
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
